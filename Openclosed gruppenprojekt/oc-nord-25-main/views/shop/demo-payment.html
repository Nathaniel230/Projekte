<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Zahlung - Stripe Checkout Simulation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-form {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stripe-logo {
            color: #635bff;
            font-weight: bold;
        }

        .card-input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 16px;
        }

        .demo-notice {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="demo-notice text-center">
            <h5>🎭 DEMO-MODUS</h5>
            <p class="mb-0">Dies ist eine Simulation von Stripe Checkout. Keine echten Zahlungen werden verarbeitet.</p>
        </div>

        <div class="payment-form">
            <div class="text-center mb-4">
                <div class="stripe-logo fs-4">stripe</div>
                <h5>Sichere Zahlung</h5>
                <p class="text-muted">Betrag: <strong id="amount">€29.99</strong></p>
            </div>

            <form id="payment-form">
                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail</label>
                    <input type="email" class="form-control" id="email" value="demo@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kartendaten</label>
                    <input type="text" class="card-input form-control" id="cardNumber" placeholder="4242 4242 4242 4242"
                        value="4242 4242 4242 4242" maxlength="19">
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <input type="text" class="card-input form-control" id="expiry" placeholder="MM/YY" value="12/25"
                            maxlength="5">
                    </div>
                    <div class="col-6">
                        <input type="text" class="card-input form-control" id="cvc" placeholder="CVC" value="123"
                            maxlength="4">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Name auf der Karte</label>
                    <input type="text" class="form-control" id="name" value="Demo User" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="payButton">
                    <div class="spinner-border spinner-border-sm d-none me-2" role="status"></div>
                    Zahlung abschließen
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">
                    🔒 Ihre Daten sind sicher verschlüsselt<br>
                    <em>Demo: Klicken Sie "Zahlung abschließen" um fortzufahren</em>
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // URL Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id') || 'demo_session';

        // Kartennummer formatieren
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.replace(/(.{4})/g, '$1 ').trim();
            if (formattedValue !== value) {
                e.target.value = formattedValue;
            }
        });

        // Ablaufdatum formatieren
        document.getElementById('expiry').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // Zahlung verarbeiten
        document.getElementById('payment-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const payButton = document.getElementById('payButton');
            const spinner = payButton.querySelector('.spinner-border');

            // Loading state
            payButton.disabled = true;
            spinner.classList.remove('d-none');
            payButton.innerHTML = '<div class="spinner-border spinner-border-sm me-2" role="status"></div>Zahlung wird verarbeitet...';

            // Simuliere Zahlungsverarbeitung
            setTimeout(() => {
                // Weiterleitung zur Erfolgsseite
                window.location.href = `/shop/success?session_id=${sessionId}`;
            }, 2000);
        });

        // Demo-Kartendaten Buttons
        const demoCards = [
            { name: 'Visa', number: '4242424242424242' },
            { name: 'Mastercard', number: '5555555555554444' },
            { name: 'Fehler-Test', number: '4000000000000002' }
        ];

        // Zurück Button
        const backButton = document.createElement('button');
        backButton.className = 'btn btn-outline-secondary mt-3 w-100';
        backButton.textContent = '← Zurück zum Shop';
        backButton.onclick = () => window.location.href = '/shop';
        document.querySelector('.payment-form').appendChild(backButton);
    </script>
</body>

</html>
