<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="text-center mb-4">{{t "login.title"}}</h2>

            <form action="/login" method="POST" class="login-form">
                <div class="mb-4">
                    <label for="email" class="form-label">{{t "login.email"}}</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">{{t "login.password"}}</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            {{t "login.rememberMe"}}
                        </label>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary login-btn">{{t "login.loginButton"}}</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="mb-2">{{t "login.noAccount"}}</p>
                <a href="/register?lng={{language}}" class="btn btn-outline-primary">{{t "login.registerNow"}}</a>
            </div>

            <div class="text-center mt-3">
                <a href="/?lng={{language}}" class="btn btn-outline-secondary">{{t "login.backToHome"}}</a>
            </div>
        </div>
    </div>
</body>

</html>
