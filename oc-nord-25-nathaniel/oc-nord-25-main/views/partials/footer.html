<footer class="footer mt-5">
  <div class="container py-5">
    <div class="row">
      <!-- Logo Section -->
      <div class="col-md-3 mb-4">
        <div class="bg-white p-3 rounded-lg text-center"
          style="height: 80px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);">
          <img src="/img/Logo_OpenClose.png" alt="OpenClose Logo" style="max-height: 180px; max-width: 100%;">
        </div>
      </div>

      <!-- Rechtliches Section -->
      <div class="col-md-3 mb-4">
        <h6 class="fw-bold text-white mb-3">{{t "footer.legal"}}</h6>
        <ul class="list-unstyled">
          <li class="mb-2"><a href="#" class="text-white-50 text-decoration-none hover-link">{{t "footer.imprint"}}</a>
          </li>
          <li class="mb-2"><a href="#" class="text-white-50 text-decoration-none hover-link">{{t "footer.terms"}}</a>
          </li>
          <li class="mb-2"><a href="#" class="text-white-50 text-decoration-none hover-link">{{t "footer.privacy"}}</a>
          </li>
        </ul>
      </div>

      <!-- Kontakt Section -->
      <div class="col-md-3 mb-4">
        <h6 class="fw-bold text-white mb-3">{{t "footer.contact"}}</h6>
        <div class="text-white-50 small">
          <div class="mb-2">
            <i class="bi bi-envelope me-2"></i>
            info@openclose.com
          </div>
          <div class="mb-2">
            <i class="bi bi-telephone me-2"></i>
            +49 123 456789
          </div>
          <div class="mb-2">
            <i class="bi bi-clock me-2"></i>
            {{t "footer.hours"}}
          </div>
        </div>
      </div>

      <!-- Adresse Section -->
      <div class="col-md-3 mb-4">
        <h6 class="fw-bold text-white mb-3">{{t "footer.location"}}</h6>
        <div class="text-white-50 small">
          <div class="mb-2">
            <i class="bi bi-geo-alt me-2"></i>
            Musterstrasse 123
          </div>
          <div class="mb-2">12345 Musterstadt</div>
          <div class="mb-2">Deutschland</div>
        </div>
      </div>
    </div>

    <!-- Copyright -->
    <hr class="my-4" style="border-color: rgba(255,255,255,0.2);">
    <div class="row">
      <div class="col-md-6">
        <p class="text-white-50 small mb-0">{{t "footer.copyright"}}</p>
      </div>
      <div class="col-md-6 text-md-end">
        <div class="social-links">
          <a href="#" class="text-white-50 me-3 hover-link"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white-50 me-3 hover-link"><i class="bi bi-twitter"></i></a>
          <a href="#" class="text-white-50 me-3 hover-link"><i class="bi bi-linkedin"></i></a>
          <a href="#" class="text-white-50 hover-link"><i class="bi bi-instagram"></i></a>
        </div>
      </div>
    </div>
  </div>
</footer>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Additional Footer Styles -->
<style>
  .hover-link {
    transition: all 0.3s ease;
  }

  .hover-link:hover {
    color: var(--primary-color) !important;
    transform: translateX(5px);
  }

  .social-links a {
    font-size: 1.2rem;
    transition: all 0.3s ease;
  }

  .social-links a:hover {
    color: var(--primary-color) !important;
    transform: translateY(-2px);
  }

  .rounded-lg {
    border-radius: 12px !important;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
