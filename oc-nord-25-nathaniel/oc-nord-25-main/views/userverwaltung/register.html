<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="text-center mb-4">{{t "register.title"}}</h2>

            {{#if error}}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{error}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {{/if}}

            <form action="/register" method="POST" class="login-form">
                <div class="mb-4">
                    <label for="name" class="form-label">{{t "register.firstName"}}</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">{{t "register.email"}}</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">{{t "register.password"}}</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    <small class="text-muted">Mindestens 6 Zeichen</small>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">{{t "register.confirmPassword"}}</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                        minlength="6">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary login-btn">{{t "register.registerButton"}}</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="mb-2">{{t "register.haveAccount"}}</p>
                <a href="/login?lng={{language}}" class="btn btn-outline-primary">{{t "register.loginNow"}}</a>
            </div>

            <div class="text-center mt-3">
                <a href="/?lng={{language}}" class="btn btn-outline-secondary">{{t "register.backToHome"}}</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
