<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClose iFrame - Geschlossen</title>
    <link rel="stylesheet" href="/css/testIframe.css">
</head>

<body>
    <div class="iframe-container">
        <div class="status-card status-closed">
            <div class="status-header">
                <h3>Geschlossen</h3>
            </div>
            <div class="status-details">
                <p class="next-open">Nächste Öffnung: Morgen 07:00</p>
            </div>

            <details class="schedule-dropdown">
                <summary>Wochenplan anzeigen</summary>
                <div class="weekly-schedule">
                    <div class="day-row">
                        <span class="day-label">Montag:</span>
                        <span class="day-hours">07:00-12:00, 13:00-18:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Dienstag:</span>
                        <span class="day-hours">07:00-12:00, 13:00-18:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Mittwoch:</span>
                        <span class="day-hours">07:00-12:00, 13:00-18:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Donnerstag:</span>
                        <span class="day-hours">07:00-12:00, 13:00-18:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Freitag:</span>
                        <span class="day-hours">07:00-12:00, 13:00-18:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Samstag:</span>
                        <span class="day-hours">08:00-16:00</span>
                    </div>
                    <div class="day-row">
                        <span class="day-label">Sonntag:</span>
                        <span class="day-hours">Geschlossen</span>
                    </div>
                </div>
            </details>
        </div>
    </div>
</body>

</html>
